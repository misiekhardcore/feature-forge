name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
      - run: pnpm run flow:generate-schema
      - run: git diff --exit-code -- packages/core/src/flows/flow-schema.json
      - run: pnpm run flow:validate-json
      # Smoke: runtime-imports @feature-forge/core (regression for the
      # type-only re-export crash that silently broke flow:validate under tsx).
      - run: pnpm -w @feature-forge/core run flow:validate:all

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
      - run: pnpm run lint
      - run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
      - run: pnpm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
      # Unit + integration tests only; the e2e suite runs in its own job below.
      - run: npx vitest run --project core --project cli

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm ci
      # The e2e suite spawns the real `pi` CLI (--mode rpc --no-session); the
      # binary ships in @earendil-works/pi-coding-agent. Pin the version that
      # matches the workspace deps so the harness and the SDK stay in sync.
      - run: pnpm install -g @earendil-works/pi-coding-agent@0.84.3
      - run: pnpm run test:e2e
