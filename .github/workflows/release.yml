name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          runtime: node@26
          cache: true

      - run: pnpm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          pnpm version ${{ inputs.version_bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          pnpm version "$NEW_VERSION" --workspaces --no-git-tag-version --allow-same-version
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump and tag
        run: |
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: release v${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new }}"

      # The tag must exist before git-cliff runs: `--latest --tag vX.Y.Z`
      # filters by tag, and a missing tag silently falls back to the previous
      # one (releases shipped with the prior version's notes as a result).
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4.9.1
        with:
          config: cliff.toml
          args: --verbose --latest --tag v${{ steps.bump.outputs.new }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for v${{ steps.bump.outputs.new }}"
          git push origin HEAD:main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: v${{ steps.bump.outputs.new }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --workspace @feature-forge/cli --access public --provenance
